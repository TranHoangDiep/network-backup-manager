{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block content %}
<h1 class="h4">Change password</h1>
<form method="post" class="col-md-5">
  {{ csrf() }}
  <div class="mb-3"><label class="form-label">Current password</label>
    <input class="form-control" type="password" name="current_password" required></div>
  <div class="mb-3"><label class="form-label">New password (min. {{ PW_MIN }} characters)</label>
    <input class="form-control" type="password" name="new_password" required minlength="{{ PW_MIN }}"></div>
  <div class="mb-3"><label class="form-label">Confirm new password</label>
    <input class="form-control" type="password" name="confirm_password" required minlength="{{ PW_MIN }}"></div>
  <button class="btn btn-primary">Update password</button>
</form>
{% endblock %}
